<!DOCTYPE html>
<html>
<head>
    <title>Percentage Calculator</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            margin: 0;
        }

        .container {
            width: 400px;
            background-color: white;
            margin: 80px auto;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 8px gray;
        }

        h2 {
            text-align: center;
            color: #2563eb;
        }

        input {
            width: 95%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            background-color: #2563eb;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 12px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Percentage Calculator</h2>

        <form action="calculate" method="post">

            <input type="text"
                   name="name"
                   placeholder="Enter Student Name"
                   required>

            <input type="number"
                   name="m1"
                   placeholder="Enter Subject-1 Marks"
                   required>

            <input type="number"
                   name="m2"
                   placeholder="Enter Subject-2 Marks"
                   required>

            <input type="number"
                   name="m3"
                   placeholder="Enter Subject-3 Marks"
                   required>

            <button type="submit">
                Calculate
            </button>

        </form>

    </div>

    <footer>
        copyright@24071A05J2
    </footer>

</body>
</html>
